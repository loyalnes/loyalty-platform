name: Bootstrap Server
# One-time workflow to set up Hetzner server infrastructure
on:
  repository_dispatch:
    types: [bootstrap-server]

concurrency:
  group: bootstrap-server
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Run server setup
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.HETZNER_PROD_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 10m
          envs: GH_TOKEN,REPO
          script: |
            set -euo pipefail
            echo "==> Running setup-server.sh..."

            # Download and run setup script
            apt-get update && apt-get install -y git

            # Clone repo to /opt/loyalty-platform (authenticated for private repos)
            if [ -d /opt/loyalty-platform/.git ]; then
              cd /opt/loyalty-platform && git pull
            else
              rm -rf /opt/loyalty-platform
              git clone https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git /opt/loyalty-platform
            fi

            cd /opt/loyalty-platform

            # Remove token from git remote (security: token is short-lived)
            git remote set-url origin https://github.com/${REPO}.git

            # Run server setup
            bash deploy/setup-server.sh

            # Set up deploy user SSH access (copy root authorized_keys)
            mkdir -p /home/deploy/.ssh
            cp /root/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys
            chown -R deploy:deploy /home/deploy/.ssh
            chmod 700 /home/deploy/.ssh
            chmod 600 /home/deploy/.ssh/authorized_keys

            # Configure nginx — simple HTTP reverse proxy (SSL added later with domain)
            cp deploy/nginx-rate-limit.conf /etc/nginx/conf.d/rate-limit.conf
            cat > /etc/nginx/sites-available/loyalty-platform <<'NGINXEOF'
            server {
                listen 80 default_server;
                server_name _;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
                gzip on;
                gzip_types text/plain application/json application/javascript text/css;
                gzip_min_length 256;
                location / {
                    proxy_pass http://127.0.0.1:3000;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                }
                location /api/ {
                    limit_req zone=api burst=20 nodelay;
                    proxy_pass http://127.0.0.1:3000;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            NGINXEOF
            sed -i 's/^            //' /etc/nginx/sites-available/loyalty-platform
            ln -sf /etc/nginx/sites-available/loyalty-platform /etc/nginx/sites-enabled/
            rm -f /etc/nginx/sites-enabled/default

            nginx -t && systemctl reload nginx
            echo "==> Nginx configured"

            # Generate DB password and create .env.prod
            DB_PASSWORD=$(openssl rand -base64 32 | tr -d '/+=' | head -c 32)
            cat > /opt/loyalty-platform/deploy/.env.prod <<ENVEOF
DB_USER=loyalty
DB_PASSWORD=${DB_PASSWORD}
DOCKER_REGISTRY=ghcr.io
DOCKER_IMAGE=${REPO}
NODE_ENV=production
ENVEOF

            chown -R deploy:deploy /opt/loyalty-platform
            echo "==> Environment file created"

            # Log in to GHCR for pulling images
            echo "${GH_TOKEN}" | docker login ghcr.io -u x-access-token --password-stdin
            echo "==> GHCR login configured"

            echo "==> Bootstrap complete! Server is ready for deployments."
