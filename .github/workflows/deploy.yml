name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE: ${{ github.repository }}

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    needs: build-image
    if: needs.build-image.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      # The SSH key referenced below is restricted on the multisite server
      # (159.69.4.205) via an OpenSSH `restrict,command="…"` entry in
      # /root/.ssh/authorized_keys. The key can ONLY trigger the per-service
      # deploy script and nothing else. Whatever we send as `script` is
      # ignored. Change deploy behavior by editing the script on the server,
      # not this workflow.
      #
      # Required GitHub repo secrets:
      #   HETZNER_PROD_HOST  — multisite host IP (source of truth for address)
      #   HETZNER_SSH_KEY    — dedicated loyali-github-deploy ed25519 private key
      #                        (NOT the personal multisite-cms-hetzner key)
      - name: Trigger restricted deploy on multisite
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HETZNER_PROD_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          # `script` is ignored by the server thanks to the forced command;
          # we send a no-op so the action's stdout still shows the deploy log.
          script: ":"
