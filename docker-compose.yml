# Base compose file — shared service definitions
# Override per environment with docker-compose.{env}.yml

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: loyalty_platform
      POSTGRES_USER: ${DB_USER:-loyalty}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-loyalty}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-loyalty}:${DB_PASSWORD}@db:5432/loyalty_platform?schema=public
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      WALLETWALLET_API_KEY: ${WALLETWALLET_API_KEY:-}
      WALLETWALLET_COLOR_PRESET: ${WALLETWALLET_COLOR_PRESET:-dark}
      WALLETWALLET_LOGO_URL: ${WALLETWALLET_LOGO_URL:-}
      WALLETWALLET_THUMBNAIL_URL: ${WALLETWALLET_THUMBNAIL_URL:-}
      WALLETWALLET_STRIP_URL: ${WALLETWALLET_STRIP_URL:-}
      GOOGLE_WALLET_ISSUER_ID: ${GOOGLE_WALLET_ISSUER_ID:-}
      GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_WALLET_SERVICE_ACCOUNT_KEY: ${GOOGLE_WALLET_SERVICE_ACCOUNT_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-https://loyali.online}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
