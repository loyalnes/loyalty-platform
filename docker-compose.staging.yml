# Staging overrides — separate database from production
services:
  db:
    environment:
      POSTGRES_DB: loyalty_staging
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

  app:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE:-loyalty-platform}:${IMAGE_TAG:-staging}
    build: !reset null
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgresql://${DB_USER:-loyalty}:${DB_PASSWORD}@db:5432/loyalty_staging?schema=public
    ports:
      - "3001:3000"
