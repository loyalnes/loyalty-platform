# Umami self-hosted analytics — adds a privacy-first analytics service
# that shares the existing Postgres instance (database "umami", isolated user).
#
# Compose stack:
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.prod.yml \
#                  -f docker-compose.umami.yml up -d
#
# Reachable inside the docker network as http://umami:3000.
# Nginx terminates TLS at https://analytics.loyali.online and proxies
# to the host port 3002 below.

services:
  # One-shot helper that ensures the umami database + user exist.
  # Idempotent: checks pg_database / pg_user before creating.
  # Runs every time the stack starts; succeeds quickly if already present.
  umami-db-init:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-loyalty}
      PGPASSWORD: ${DB_PASSWORD}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:?UMAMI_DB_PASSWORD is required}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "==> Ensuring umami DB user exists..."
        psql -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='umami'" | grep -q 1 \
          || psql -d postgres -c "CREATE USER umami WITH PASSWORD '$${UMAMI_DB_PASSWORD}'"
        echo "==> Ensuring umami database exists..."
        psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='umami'" | grep -q 1 \
          || psql -d postgres -c "CREATE DATABASE umami OWNER umami"
        # Make sure the password is current even if the user was created earlier
        psql -d postgres -c "ALTER USER umami WITH PASSWORD '$${UMAMI_DB_PASSWORD}'"
        echo "==> Umami DB init complete"
    restart: "no"

  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      umami-db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET is required}
      DISABLE_TELEMETRY: "1"
    ports:
      - "127.0.0.1:3002:3000"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
