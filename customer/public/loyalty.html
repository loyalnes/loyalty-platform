<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Loyalty</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #f5f7ff 0%, #eef2ff 100%);
      color: #1f2937;
      min-height: 100vh;
      min-height: 100dvh;
      padding: clamp(18px, 5vw, 24px) clamp(14px, 4vw, 16px) clamp(32px, 9vw, 48px);
    }
    .shell { max-width: 720px; margin: 0 auto; display: grid; gap: 16px; }
    .hero, .card, .timeline-item {
      background: white;
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }
    .hero { padding: clamp(20px, 5vw, 24px); }
    .kicker { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #6366f1; margin-bottom: 8px; }
    .title { font-size: clamp(24px, 7vw, 28px); font-weight: 700; margin-bottom: 6px; overflow-wrap: anywhere; }
    .subtitle { color: #6b7280; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .card { padding: 18px; }
    .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #94a3b8; margin-bottom: 6px; }
    .value { font-size: clamp(24px, 7vw, 28px); font-weight: 700; }
    .value-sm { font-size: 18px; font-weight: 600; }
    .list { display: grid; gap: 10px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 6px 12px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 13px;
      font-weight: 600;
    }
    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
    .prize-row, .timeline-item {
      padding: 16px 18px;
      display: grid;
      gap: 4px;
    }
    .prize-row { border: 1px solid #e5e7eb; border-radius: 14px; background: #fff; }
    .muted { color: #6b7280; font-size: 14px; }
    .empty { color: #6b7280; font-size: 15px; }
    .timeline-item { gap: 8px; }
    .loading, .error {
      max-width: 720px;
      margin: 60px auto 0;
      text-align: center;
      color: #6b7280;
      font-size: 16px;
    }
    .error { color: #b91c1c; }

    @media (max-width: 380px) {
      .shell {
        gap: 12px;
      }

      .card,
      .prize-row,
      .timeline-item {
        padding: 16px;
      }

      .section-title {
        font-size: 17px;
      }

      .muted,
      .empty {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">Loading loyalty page...</div>
  <div id="error" style="display:none; max-width:500px; margin:60px auto; text-align:center; padding:32px 24px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <div style="font-size:48px; margin-bottom:16px;">&#128532;</div>
    <div style="font-size:20px; font-weight:700; color:#333; margin-bottom:8px;">Something went wrong</div>
    <div id="errorMessage" style="color:#6b7280; font-size:15px; margin-bottom:24px;"></div>
    <button onclick="window.location.reload()" style="padding:12px 24px; background:#4F46E5; color:white; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer;">Try Again</button>
  </div>
  <div id="app" class="shell" style="display:none;">
    <section class="hero">
      <div class="kicker" id="merchantName"></div>
      <div class="title" id="customerName"></div>
      <div class="subtitle" id="cardNumber"></div>
    </section>

    <section class="grid">
      <div class="card">
        <div class="label">Points</div>
        <div class="value" id="pointsBalance"></div>
      </div>
      <div class="card">
        <div class="label">Tier</div>
        <div class="value-sm" id="tierName"></div>
      </div>
      <div class="card">
        <div class="label">Active Prizes</div>
        <div class="value-sm" id="activePrizeCount"></div>
      </div>
    </section>

    <section class="card">
      <div class="section-title">Active Prizes</div>
      <div id="activePrizes" class="list"></div>
    </section>

    <section class="card">
      <div class="section-title">Redeemable Rewards</div>
      <div id="availableRewards" class="list"></div>
    </section>

    <section class="card">
      <div class="section-title">Recent Activity</div>
      <div id="recentHistory" class="list"></div>
    </section>

    <section class="card">
      <div class="section-title">Missions</div>
      <div class="empty">Coming soon: reviews, referrals, and sharing rewards.</div>
    </section>
  </div>

  <script>
    async function loadLoyaltyPage() {
      const token = window.location.pathname.split('/').pop();

      try {
        const res = await fetch(`/api/wallet/access/${token}`);
        if (!res.ok) {
          const body = await res.json().catch(() => ({ error: 'Failed to load loyalty page' }));
          throw new Error(body.error || 'Failed to load loyalty page');
        }

        const data = await res.json();
        document.getElementById('merchantName').textContent = data.merchantName;
        document.getElementById('customerName').textContent = data.customerName;
        document.getElementById('cardNumber').textContent = `Card ${data.cardNumber}`;
        document.getElementById('pointsBalance').textContent = data.pointsBalanceDisplay;
        document.getElementById('tierName').textContent = data.tierName || 'No tier yet';
        document.getElementById('activePrizeCount').textContent = String(data.activePrizeCount);

        const activePrizes = document.getElementById('activePrizes');
        activePrizes.innerHTML = data.activePrizes.length
          ? data.activePrizes.map((prize) => `
              <div class="prize-row">
                <div><strong>${prize.name}</strong></div>
                <div class="muted">Expires ${new Date(prize.expiresAt).toLocaleString()}</div>
                <div><span class="pill">${prize.prizeType}</span></div>
              </div>
            `).join('')
          : '<div class="empty">No active prizes right now.</div>';

        const availableRewards = document.getElementById('availableRewards');
        availableRewards.innerHTML = data.availableRewards.length
          ? data.availableRewards.map((reward) => `
              <div class="prize-row">
                <div><strong>${reward.rewardName}</strong></div>
                <div class="muted">${reward.threshold} pts</div>
              </div>
            `).join('')
          : '<div class="empty">No rewards currently redeemable.</div>';

        const recentHistory = document.getElementById('recentHistory');
        recentHistory.innerHTML = data.recentHistory.length
          ? data.recentHistory.map((item) => `
              <div class="timeline-item">
                <div><strong>${item.description}</strong></div>
                <div class="muted">${item.event} · ${new Date(item.createdAt).toLocaleString()}</div>
                ${item.pointsDelta !== null ? `<div class="muted">${item.pointsDelta > 0 ? '+' : ''}${item.pointsDelta} pts</div>` : ''}
              </div>
            `).join('')
          : '<div class="empty">No activity yet.</div>';

        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').style.display = 'grid';
      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('errorMessage').textContent = err.message || 'Failed to load loyalty page';
        document.getElementById('error').style.display = 'block';
      }
    }

    loadLoyaltyPage();
  </script>
</body>
</html>
