# --- Default (catch-all for IP access) ---

server {
    listen 80 default_server;
    server_name _;

    auth_basic "Loyali (Pre-launch)";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
