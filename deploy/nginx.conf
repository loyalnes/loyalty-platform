# Nginx reverse proxy configuration for loyalty platform
# Copy to /etc/nginx/sites-available/loyalty-platform
# Then: ln -s /etc/nginx/sites-available/loyalty-platform /etc/nginx/sites-enabled/
# Then: nginx -t && systemctl reload nginx

# Staging (port 3001 internally)
server {
    listen 80;
    server_name staging.loyalty.example.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Production (port 3000 internally)
server {
    listen 80;
    server_name loyalty.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
