# Nginx reverse proxy configuration for Loyali platform
# All environments are behind basic auth (pre-launch)
#
# Setup:
#   htpasswd -c /etc/nginx/.htpasswd loyali
#   cp deploy/nginx.conf /etc/nginx/sites-available/loyalty-platform
#   ln -sf /etc/nginx/sites-available/loyalty-platform /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d loyali.online -d staging.loyali.online

# --- Production (loyali.online) ---

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name loyali.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name loyali.online;

    # Managed by certbot
    ssl_certificate /etc/letsencrypt/live/loyali.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loyali.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Basic auth (remove after public launch)
    auth_basic "Loyali (Pre-launch)";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 256;

    # Proxy timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API endpoints — no basic auth (API has its own X-API-Key auth)
    location /api/ {
        auth_basic off;
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check — no auth required (for Docker healthcheck and monitoring)
    location = /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

