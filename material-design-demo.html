<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material Design 3 Web App</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@1&family=DM+Sans:wght@700&display=swap" rel="stylesheet">

  <!-- Material Symbols Variable -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Material Web Components Import Map -->
  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>

  <style>
    /* Material Design 3 Color System */
    :root {
      /* Primary */
      --md-sys-color-primary: #725BF3;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #725BF3;
      --md-sys-color-on-primary-container: #FFFFFF;

      /* Secondary */
      --md-sys-color-secondary: #725BF3;
      --md-sys-color-on-secondary: #FFFFFF;
      --md-sys-color-secondary-container: #EFFF74;
      --md-sys-color-on-secondary-container: #6B7600;

      /* Surface */
      --md-sys-color-surface: #FCF8FF;
      --md-sys-color-on-surface: #1C1B1F;
      --md-sys-color-surface-variant: #FCF8FF;
      --md-sys-color-on-surface-variant: #49454F;

      /* Background */
      --md-sys-color-background: #FCF8FF;
      --md-sys-color-on-background: #1C1B1F;

      /* Outline */
      --md-sys-color-outline: #725BF3;
      --md-sys-color-outline-variant: #CAC4D0;

      /* Typography Scale */
      --md-sys-typescale-display-large-font-family-name: 'DM Serif Display';
      --md-sys-typescale-display-large-font-family-style: italic;
      --md-sys-typescale-label-large-font-family-name: 'DM Sans';
      --md-sys-typescale-label-large-font-weight: 700;
      --md-sys-typescale-body-large-font-family-name: 'DM Sans';
      --md-sys-typescale-body-large-font-weight: 700;

      /* Shape */
      --md-outlined-text-field-container-shape: 28px;
      --md-filled-button-container-shape: 28px;
      --md-fab-container-shape: 28px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Main Card */
    .main-card {
      background: var(--md-sys-color-primary-container);
      border-radius: 48px;
      padding: 48px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 4px 16px rgba(114, 91, 243, 0.2);
      position: relative;
      overflow: hidden;
    }

    /* Display Title */
    .display-title {
      font-family: 'DM Serif Display', serif;
      font-style: italic;
      font-size: 3.5rem;
      line-height: 1.1;
      color: var(--md-sys-color-on-primary-container);
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }

    /* Image Container with Organic Cloud Shape */
    .image-container {
      width: 100%;
      height: 280px;
      margin: 32px 0;
      position: relative;
    }

    .masked-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      clip-path: url(#organic-cloud);
    }

    /* Controls Section */
    .controls {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
      margin: 32px 0;
    }

    /* Icon Buttons */
    md-icon-button {
      --md-icon-button-icon-color: var(--md-sys-color-on-primary-container);
      --md-icon-button-state-layer-shape: 50%;
      --md-icon-button-container-shape: 50%;
    }

    md-icon-button:hover {
      filter: brightness(0.9);
    }

    /* Extended FAB (PLAY button) */
    md-fab {
      --md-fab-container-color: var(--md-sys-color-secondary-container);
      --md-fab-label-text-color: var(--md-sys-color-on-secondary-container);
      --md-fab-icon-color: var(--md-sys-color-on-secondary-container);
      --md-fab-container-shape: 28px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    md-fab:hover {
      filter: brightness(0.92);
    }

    /* TextField */
    .input-section {
      margin-top: 32px;
    }

    md-outlined-text-field {
      width: 100%;
      --md-outlined-text-field-outline-color: var(--md-sys-color-outline);
      --md-outlined-text-field-focus-outline-color: var(--md-sys-color-primary);
      --md-outlined-text-field-container-shape: 28px;
      --md-outlined-text-field-label-text-color: var(--md-sys-color-on-primary-container);
      --md-outlined-text-field-input-text-color: var(--md-sys-color-on-primary-container);
    }

    /* Material Icons styling */
    .material-symbols-outlined {
      font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .main-card {
        padding: 32px 24px;
        border-radius: 32px;
      }

      .display-title {
        font-size: 2.5rem;
      }

      .image-container {
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <!-- SVG Definitions for Organic Cloud Shape -->
  <svg width="0" height="0">
    <defs>
      <clipPath id="organic-cloud" clipPathUnits="objectBoundingBox">
        <path d="M0.15,0.1 C0.05,0.15 0.02,0.3 0.08,0.45 C0.05,0.55 0.1,0.7 0.2,0.8 C0.15,0.9 0.25,0.98 0.4,0.95 C0.5,1 0.65,0.95 0.75,0.88 C0.88,0.92 0.95,0.8 0.92,0.65 C0.98,0.55 0.95,0.4 0.85,0.3 C0.9,0.2 0.8,0.08 0.65,0.12 C0.55,0.05 0.4,0.08 0.3,0.15 C0.2,0.08 0.15,0.1 0.15,0.1 Z" />
      </clipPath>
    </defs>
  </svg>

  <main class="main-card">
    <h1 class="display-title">Serafina</h1>

    <!-- Image with Organic Cloud Mask -->
    <div class="image-container">
      <img
        src="https://images.unsplash.com/photo-1614624532983-4ce03382d63d?w=500&h=300&fit=crop"
        alt="Purple gradient abstract"
        class="masked-image"
      >
    </div>

    <!-- Control Buttons -->
    <div class="controls">
      <md-icon-button>
        <span class="material-symbols-outlined">skip_previous</span>
      </md-icon-button>

      <md-fab label="PLAY" size="large" variant="primary">
        <span class="material-symbols-outlined" slot="icon">play_arrow</span>
      </md-fab>

      <md-icon-button>
        <span class="material-symbols-outlined">skip_next</span>
      </md-icon-button>
    </div>

    <!-- Outlined TextField -->
    <div class="input-section">
      <md-outlined-text-field
        label="Enter your name"
        type="text"
        placeholder="Type here..."
      ></md-outlined-text-field>
    </div>
  </main>

  <!-- Material Web Components -->
  <script type="module">
    import '@material/web/all.js';
    import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';

    // Adopt typography styles
    document.adoptedStyleSheets.push(typescaleStyles.styleSheet);

    // Optional: Add interaction handlers
    const fab = document.querySelector('md-fab');
    fab?.addEventListener('click', () => {
      console.log('▶️ PLAY button clicked!');
    });
  </script>
</body>
</html>
